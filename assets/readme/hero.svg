<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">dsh-grok-kit</title>
  <desc id="desc">DeepSeek Harness 的 Grok OAuth 与主循环融合搜索插件</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4d6bfe" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="url(#bg)" stroke="#dfe6fb"/>

  <!-- Plugin badge: the lowercase g is the plugin's own UI mark, not an official xAI logo. -->
  <g transform="translate(100 124) scale(4.5)">
    <rect x="-2.2" y="-2.2" width="20.4" height="20.4" rx="4.6" fill="#4d6bfe"/>
    <text x="8" y="12.3" text-anchor="middle"
          font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="750"
          fill="#ffffff">g</text>
  </g>

  <text x="248" y="148" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace"
        font-size="44" font-weight="700" fill="#16204a" letter-spacing="-0.5">dsh-grok-kit</text>
  <text x="248" y="192" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="23" fill="#3d4468">DeepSeek Harness 的 Grok OAuth 与融合搜索插件</text>
  <text x="248" y="228" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="16" fill="#7c84a8">复用 Grok CLI 登录 · 网页与 X 搜索融合进同一轮 Think · 支持独立网络代理</text>
  <text x="248" y="254" font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif"
        font-size="16" fill="#7c84a8">unofficial community integration for the DSH Web GUI</text>

  <!-- Main-loop search: one answer path, with Web and X folded into Think. -->
  <g font-family="'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" filter="url(#soft-shadow)">
    <rect x="846" y="133" width="108" height="54" rx="16" fill="#ffffff" stroke="#cfd9fb"/>
    <text x="900" y="166" text-anchor="middle" font-size="17" font-weight="650" fill="#3d4468">提问</text>

    <rect x="1000" y="118" width="118" height="84" rx="22" fill="#4d6bfe"/>
    <text x="1059" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Think</text>
    <text x="1059" y="178" text-anchor="middle" font-size="13" fill="#e8edff">Web · X</text>
  </g>

  <g fill="none" stroke="#4d6bfe" stroke-linecap="round" stroke-linejoin="round">
    <path d="M954 160h34" stroke-width="3" opacity="0.62"/>
    <path d="m981 153 8 7-8 7" stroke-width="3" opacity="0.62"/>
    <path d="M1059 106V84" stroke-width="3" opacity="0.35"/>
    <path d="M1059 214v22" stroke-width="3" opacity="0.35"/>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700" fill="#4d6bfe">
    <rect x="1023" y="50" width="72" height="34" rx="17" fill="#ffffff" stroke="#cfd9fb"/>
    <text x="1059" y="72" text-anchor="middle">WEB</text>
    <rect x="1023" y="236" width="72" height="34" rx="17" fill="#ffffff" stroke="#cfd9fb"/>
    <text x="1059" y="258" text-anchor="middle">X</text>
  </g>

  <g transform="translate(1146 160)" fill="none" stroke="#4d6bfe" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-28 0h14" stroke-width="3" opacity="0.62"/>
    <path d="m-20-7 8 7-8 7" stroke-width="3" opacity="0.62"/>
    <rect x="0" y="-22" width="40" height="44" rx="13" stroke-width="3" opacity="0.78"/>
    <path d="M11-8h18M11 0h14M11 8h10" stroke-width="2.3" opacity="0.78"/>
  </g>
</svg>
