name: publish-npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup npm with trusted-publishing support
        run: npm install --global npm@11.19.0

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag_type=$(git cat-file -t "refs/tags/$RELEASE_TAG")
          tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_type" != tag ]; then
            echo "::error::$RELEASE_TAG is not an annotated tag"
            exit 1
          fi
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::$RELEASE_TAG does not point to the checked-out commit"
            exit 1
          fi
          node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.RELEASE_TAG!==expected){console.error('release tag '+process.env.RELEASE_TAG+' does not match '+expected); process.exit(1)}"

      - name: Reject an already-published version
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          if npm view "$package_name@$package_version" version --silent >/dev/null 2>&1; then
            echo "::error::$package_name@$package_version is already published"
            exit 1
          fi

      - name: Install (frozen lockfile, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Dependency tree is complete
        run: npm ls --all

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: lib/ must match committed artifacts
        run: git diff --exit-code -- lib

      - name: Package contents and CLI mode
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(npm pack --ignore-scripts --silent)"
          package_dir="$RUNNER_TEMP/dsh-grok-kit-package"
          mkdir -p "$package_dir"
          tar -xzf "$package_file" -C "$package_dir"
          test -x "$package_dir/package/lib/bin.js"
          test -f "$package_dir/package/README.md"
          test -f "$package_dir/package/README.en.md"
          test -f "$package_dir/package/LICENSE"
          test -f "$package_dir/package/NOTICE"
          test ! -e "$package_dir/package/.github"
          test ! -e "$package_dir/package/tests"
          rm "$package_file"

      - name: Setup pnpm for DSH plugin smoke
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Isolated pack-install smoke
        run: |
          npm install -g @deepseek-ai/dsh@0.1.2-rc.1
          node scripts/pack-install-smoke.mjs

      - name: Publish to npm
        run: npm publish --ignore-scripts --access public
