name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install (frozen lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: lib/ must match committed artifacts
        run: git diff --exit-code -- lib

      - name: Package contents and CLI mode
        shell: bash
        run: |
          package_file="$(npm pack --ignore-scripts --silent)"
          package_dir="$RUNNER_TEMP/dsh-grok-kit-package"
          mkdir -p "$package_dir"
          tar -xzf "$package_file" -C "$package_dir"
          test -x "$package_dir/package/lib/bin.js"
          test -f "$package_dir/package/README.md"
          test -f "$package_dir/package/README.en.md"
          test ! -e "$package_dir/package/.github"
          test ! -e "$package_dir/package/tests"
